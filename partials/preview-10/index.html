<style>
  * {
    box-sizing: border-box;
  }

  body {
    background: white;
    padding: 2rem;
  }

  main {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .calendar {
    display: grid;
    width: 400px;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: repeat(6, 1fr);
    height: 500px;
    gap: 0.25rem;

    & div {
      cursor: pointer;
    }
  }
  .action-footer {
    view-transition-name: actions;
    display: flex;
    justify-content: space-between;

    input[type="text"] {
      border-radius: 2rem;
      padding: 0.75rem;
      border: 1px solid #ccc;
    }

    svg {
      border: 1px solid #ccc;
      border-radius: 50%;
      align-self: end;
      padding: 5px;
      font-size: 1rem;
      width: 2rem;
    }
  }


  dialog {
    width: 100%;
    border: none;
    background-color: transparent;
    padding: 0;


    section {
      width: 100%;
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;

      article {
        flex: none;
        height: 80vh;
        width: 80%;
        padding: 2rem;
        scroll-snap-align: center;

        opacity: 0.8;
        transition: all 0.5s ease-in-out;

        &.active {
          opacity: 1;
          padding: 0;
        }


        .event-wrapper {
          display: grid;
          grid-template-rows: auto 1fr auto;

          padding: 2rem;
          border-radius: 1rem;
          background-color: white;
          height: 100%;
        }
      }

    }


  }
</style>
<script>
  const eventEls = document.querySelectorAll(".event");
  let eventEl = null;

  eventEls.forEach((event) => {
    event.addEventListener("click", (e) => {
      eventEl = e.target
      const eventStyle = e.target.style
      eventStyle.viewTransitionName = 'Event'
  

      document.startViewTransition(() => {
        eventStyle.viewTransitionName = null
        
        dialog.style.viewTransitionName = 'Event'

        dialog.showModal();
        
      })
    });
  });

  const sectionEl = dialog.querySelector("section")
  const articleEls = sectionEl.querySelectorAll("article")


  sectionEl.addEventListener('snapchanged', e => {

    articleEls.forEach(a => a.classList.remove('active'))

    e.snapTargetInline.classList.add('active')
    e.querySelector("footer").appendChild(actionFooter);
  }) 

  dialog.addEventListener("click",  ({ target: dialog }) => {
    if (dialog.nodeName === "DIALOG") {
      dialogCloseWithTransition()
    }
  });

  async function dialogCloseWithTransition() {
		const transition = document.startViewTransition(() => {
			dialog.style.viewTransitionName = "Event";
			eventEl.style.viewTransitionName = "Event";
			footerMain.appendChild(actionFooter);
			dialog.close();
		});

		await transition.finished;
		eventEl.style.viewTransitionName = "";
  }

  const closeEl = dialog.querySelector("#dialogClose")
  closeEl.addEventListener("click", async() => {
    dialogCloseWithTransition()


  });

</script>
